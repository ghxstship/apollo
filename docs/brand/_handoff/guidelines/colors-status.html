<!-- REFERENCE SPECIMEN · group="Colors" viewport="700x170" subtitle="Status overrides every brand and division accent" name="Status" (not compiled) -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:18px 20px;box-sizing:border-box}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:8px"><div style="flex:1"><div style="height:64px;border-radius:4px;background:var(--positive);border:1px solid var(--border-subtle)"></div><div style="font:700 10px/1.5 var(--font-mono);letter-spacing:.08em;margin-top:6px;color:var(--text-body)">positive</div><div style="font:400 10px/1.4 var(--font-mono);color:var(--text-muted)">confirmed</div></div><div style="flex:1"><div style="height:64px;border-radius:4px;background:var(--caution);border:1px solid var(--border-subtle)"></div><div style="font:700 10px/1.5 var(--font-mono);letter-spacing:.08em;margin-top:6px;color:var(--text-body)">caution</div><div style="font:400 10px/1.4 var(--font-mono);color:var(--text-muted)">hold</div></div><div style="flex:1"><div style="height:64px;border-radius:4px;background:var(--danger);border:1px solid var(--border-subtle)"></div><div style="font:700 10px/1.5 var(--font-mono);letter-spacing:.08em;margin-top:6px;color:var(--text-body)">danger</div><div style="font:400 10px/1.4 var(--font-mono);color:var(--text-muted)">void</div></div></div><div style="font:400 12px/1.6 var(--font-body);color:var(--text-faint);margin-top:10px">Three states only. Status colour always wins over a division accent — a weather hold reads amber whichever club is sailing.</div></body></html>
