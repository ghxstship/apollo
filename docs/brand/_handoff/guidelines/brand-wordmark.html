<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:18px 20px;box-sizing:border-box}*{box-sizing:border-box}.bk{font:400 36px/1 var(--font-display);letter-spacing:.02em}.sf{font:700 28px/1 var(--font-mono);letter-spacing:-.01em;margin-left:.3em}.lbl{font:700 9px/1 var(--font-mono);letter-spacing:var(--tracking-dense);color:var(--text-faint)}</style></head><body>
